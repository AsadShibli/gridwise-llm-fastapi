# Local stack after the competition: Postgres + FastAPI + Django console.
# FastAPI judge routes stay on port 8000. Django UI is port 8001.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gridwise
      POSTGRES_PASSWORD: gridwise
      POSTGRES_DB: gridwise
    ports:
      - "5432:5432"
    volumes:
      - gridwise_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridwise"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PORT: "8000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8001:8001"
    environment:
      DJANGO_SECRET_KEY: compose-dev-only-change-me
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DATABASE_URL: postgresql://gridwise:gridwise@db:5432/gridwise
      FASTAPI_URL: http://api:8000
      SAMPLE_JSON_PATH: /data/sample.json
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  gridwise_pg:
