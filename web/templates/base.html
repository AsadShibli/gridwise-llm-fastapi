<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GridWise Console{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 1.5rem auto; padding: 0 1rem; }
    nav a { margin-right: 0.75rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.5rem; text-align: left; }
    .err { color: #a00; }
    .ok { color: #060; }
    textarea { width: 100%; min-height: 4rem; }
  </style>
</head>
<body>
  <nav>
    <strong>GridWise Console</strong>
    {% if user.is_authenticated %}
      <a href="{% url 'run_list' %}">History</a>
      <a href="{% url 'run_new' %}">New run</a>
      <form action="{% url 'logout' %}" method="post" style="display:inline">
        {% csrf_token %}
        <button type="submit">Log out ({{ user.username }})</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}">Log in</a>
      <a href="{% url 'register' %}">Register</a>
    {% endif %}
  </nav>
  <hr>
  {% if messages %}
    {% for message in messages %}<p>{{ message }}</p>{% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
